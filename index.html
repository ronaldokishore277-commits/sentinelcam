<!DOCTYPE html>
<html>
<head>
    <title>SentinelCam - Smart Vision</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        #camera-feed {
            width: 100%;
            display: block;
            background: #000;
        }
        
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .stats-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            z-index: 10;
        }
        
        .slider-container {
            margin-top: 15px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
        }
        
        input[type=range] {
            width: 100%;
            margin: 10px 0;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.7;
        }
        
        .badge {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SentinelCam <span class="badge">v2.0</span></h1>
        <p class="subtitle">AI-Powered Smart Camera System</p>
        
        <div class="camera-container">
            <video id="camera-feed" autoplay playsinline></video>
            <canvas id="overlay-canvas"></canvas>
            <div id="loading-message" class="loading">Loading AI model...</div>
        </div>
        
        <div class="stats-panel">
            <div class="stat-item">
                <div class="stat-label">FPS</div>
                <div class="stat-value" id="fps-display">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Objects Detected</div>
                <div class="stat-value" id="count-display">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Light Level</div>
                <div class="stat-value" id="light-display">Waiting...</div>
            </div>
        </div>
        
        <div class="slider-container">
            <label>Confidence Threshold: <span id="conf-value">50%</span></label>
            <input type="range" id="confidence-slider" min="10" max="90" value="50">
        </div>
        
        <div class="controls">
            <button id="save-btn">📸 Save Photo</button>
            <button id="camera-btn">🔄 Switch Camera</button>
            <button id="fullscreen-btn">⛶ Fullscreen</button>
        </div>
        
        <div class="footer">
            Made for Hackathon | TensorFlow.js + COCO-SSD
        </div>
    </div>

    <!-- Load TensorFlow and Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <!-- Our JavaScript -->
    <script src="app.js"></script>
</body>
</html>
